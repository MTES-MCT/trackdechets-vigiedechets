name: TD Inspection CI

on: pull_request

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.tests
      DATABASE_URL: postgresql://admin:postgres@localhost/vigiedechets_test
      DEFENDER_REDIS_URL: redis://localhost:6379/0
      ADMIN_SLUG: admin
      API_SLUG: apisecret
      TD_WEBHOOK_URL: http://api.track.test/webhook
      TD_WEBHOOK_TOKEN: xyz123
      MESSAGE_RECIPIENTS: lorem@ipsum.lol
      MONAIOT_OIDC_RP_CLIENT_SECRET: pxyz
      MONAIOT_OIDC_OP_SERVER_URL: https://monaiot.test/auth/realms/MonAIOT-integration/protocol/openid-connect
      PROCONNECT_OIDC_OP_SERVER_URL: https://proconnect.test
      PROCONNECT_OIDC_RP_CLIENT_ID: xyz
      PROCONNECT_OIDC_RP_CLIENT_SECRET: abcd
      ID_ID_CURRASSO: currasso-idp
      CSRF_TRUSTED_ORIGINS: "https://url.test"
      TD_API_URL: http://api.test
      TD_API_TOKEN: xyz
      AWS_S3_BUCKET_NAME: vigidechets-test
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ENDPOINT_URL: "http://localhost:9000"
      AWS_S3_ACCESS_KEY_ID: "minioadmin"
      AWS_S3_SECRET_ACCESS_KEY: "minioadmin"
      GUN_DATA_UPDATE_DATE_STRING: "Février 2025"
      GISTRID_DATA_UPDATE_DATE_STRING: "Février 2025"
      RNDTS_DATA_UPDATE_DATE_STRING: "Novembre 2024"
      DWH_USERNAME: username
      DWH_PASSWORD: xyz
      DWH_PORT: 10001
      DWH_SSH_HOST: 12.345.678.123
      DWH_SSH_PORT: 22
      DWH_SSH_USERNAME: user
      DWH_SSH_LOCAL_BIND_HOST: 0.0.0.0
      DWH_SSH_LOCAL_BIND_PORT: 12001
      DWH_SSH_KEY: ssh key
      DWH_SSH_KEY_PASSPHRASE: passphrase
      ALLOWED_USER_FOR_SENTINEL: ""
      ALLOWED_EMAILS_FOR_DATA_EXPORT: ""
      PARQUET_BUCKET_NAME: "donnees-test"
      SUPPORT_FORM_RECIPIENT: "test@test.com"
    services:
      postgres:
        image: postgis/postgis
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: vigiedechets_test
        ports: [ "5432:5432" ]
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772 server /data --console-address ":9001"

          # Wait for MinIO to be ready
          until curl -f http://localhost:9000/minio/health/live; do
            sleep 1
          done

      - name: Create MinIO bucket
        run: |
          # Download mc client with retry logic
          for i in {1..3}; do
            curl -f -o mc https://dl.min.io/client/mc/release/linux-amd64/mc && break
            echo "Download attempt $i failed, retrying..."
            sleep 2
          done
          
          # Verify the binary is valid
          if ! file mc | grep -q "ELF 64-bit"; then
            echo "Downloaded file is not a valid ELF binary"
            cat mc
            exit 1
          fi
          
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb --ignore-existing myminio/vigidechets-test

      - name: Set locales
        run: sudo apt-get install -y tzdata locales && sudo locale-gen fr_FR && sudo dpkg-reconfigure --frontend=noninteractive locales

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install binutils libproj-dev gdal-bin libgdal-dev

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Pin Python version for uv
        run: uv python pin 3.11

      - name: Install python dependencies
        run: uv sync --frozen --group test

      - name: Ruff Linting
        run: uv run --frozen ruff check .

      - name: Ruff Formatting
        run: uv run --frozen ruff format --check .

      - name: Bandit security checks
        run: uv run --frozen bandit --exit-zero -c pyproject.toml  -r src

      - name: Run Tests
        working-directory: src
        run: uv run --frozen pytest
