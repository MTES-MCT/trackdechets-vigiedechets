{% load static %}
<div class="fr-grid-row fr-grid-row--gutters">
    <div class="fr-col-12">
        <h3>Statistiques nationales</h3>


        <div class="htmx-indicator" id="id_spinner__wrapper_1">{% include "spinner.html" %}</div>
        <div id="id_results_1" hx-post="{% url "sentinel_national_result" %}"
             hx-vals='{
 "selected_naf_code":  "{{ naf_code }}",
 "department":"{{ department }}"
 }'
             hx-trigger="load"
             hx-indicator="#id_spinner__wrapper_1"
             hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        >
        </div>

    </div>
</div>
<h3 class="fr-mt-2w">Statistiques départementales</h3>
<div class="htmx-indicator" id="id_spinner__wrapper_2">{% include "spinner.html" %}</div>

<div id="id_results_2" hx-post="{% url "sentinel_department_result" %}"
     hx-vals='{
 "selected_naf_code":  "{{ naf_code }}",
 "department": "{{ department }}"
 }'
     hx-trigger="load"
     hx-indicator="#id_spinner__wrapper_2"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
></div>


<div style="position: relative" class="fr-mt-3w">
    <div class="htmx-indicator" id="id_spinner__wrapper_3">{% include "spinner.html" with backdrop=1 %}</div>
    <div hx-post="{% url "sentinel_result_tabs" category="not_registered" %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
         hx-trigger="load"
         hx-indicator="#id_spinner__wrapper_3"
         hx-vals='{
        "selected_naf_code":  "{{ naf_code }}",
        "department": "{{ department }}"

    }'
         id="id_tab_container"></div>

</div>
