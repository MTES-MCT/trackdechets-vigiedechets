{% if recent_downloads %}
<div style="background: white; border: 1px solid #dddddd; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: visible;">
    <div style="padding: 1px 7px 1px; border-bottom: 2px solid #dddddd; background-color: #e3e2f2;">
        <span style="font-size: 0.7rem; font-weight: 700; color: #3e1399; letter-spacing: 0.05em; text-transform: uppercase;">
            Recherche récente
        </span>
    </div>
    {% for download in recent_downloads %}
    <input type="hidden" class="data-test-id" value="{{ download.pk }}">
    <button
        type="button"
        style="display:block; width:100%; text-align:left; background:none; border:none; border-bottom: 1px solid #eeeeee; padding: 4px 7px 4px; font-size: 0.875rem; color: #1e1e1e; cursor:pointer;"
        onmouseover="this.style.background='#f6f6f6'"
        onmouseout="this.style.background='none'"
        onclick="
            document.getElementById('id_bsd_id').value = '{{ download.bsd_id }}';
            document.getElementById('recent-bsds-list').innerHTML = '';
        ">
        <strong>Bord. n°</strong>{{ download.bsd_id }}
    </button>
    {% endfor %}
</div>
{% endif %}
